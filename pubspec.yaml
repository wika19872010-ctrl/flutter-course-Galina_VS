# Файл зависимостей, версии приложения и подключения изображений из assets.

name: flutter_application_dz_27092026 # Имя пакета, используемое в импортах.
description: "Каталог книг с Firebase и Cubit." # Назначение учебного приложения.
publish_to: 'none' # Приложение не публикуется как пакет.
version: 1.0.0+1 # Версия приложения и номер сборки.
environment: # Совместимые версии среды Dart.
  sdk: ^3.13.4 # Минимальная версия Dart для проекта.

dependencies: # Библиотеки, используемые приложением.
  flutter: # Базовый набор виджетов и навигации.
    sdk: flutter # Берём Flutter из установленного SDK.
  firebase_core: 5.0.0 # Подключение к Firebase-проекту.
  firebase_auth: 7.0.0 # Вход, регистрация и восстановление сессии.
  flutter_bloc: ^9.1.1 # Cubit, BlocProvider, BlocBuilder и BlocListener.
  image_picker: ^1.2.4 # Выбор фотографии из галереи.
  cloud_firestore: 7.0.0 # Чтение, подписки и атомарные записи в Firestore.

dev_dependencies: # Зависимости, нужные только при разработке.
  flutter_test: # Средства тестирования Flutter.
    sdk: flutter # Тестовые инструменты поставляются вместе с SDK.
  flutter_lints: ^6.0.0 # Рекомендованные правила статического анализа.
  cloud_firestore_platform_interface: '>=8.0.0 <8.1.0' # Совместимо с fake_cloud_firestore 4.4.0.
  fake_cloud_firestore: ^4.4.0 # Проверки репозиториев без рабочей базы.
  mock_exceptions: ^0.8.2 # Подмена ошибок SDK в тестах.

flutter: # Настройки Flutter-приложения.
  uses-material-design: true # Подключаем стандартные Material-иконки.
  assets: # Файлы, включаемые в приложение.
    - assets/ # Локальные обложки книг.
