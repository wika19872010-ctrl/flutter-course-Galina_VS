# Файл правил статического анализа Dart и исключений для сгенерированной сборки.

include: package:flutter_lints/flutter.yaml # Проверяем код стандартными правилами Flutter.

analyzer: # Настраиваем область статического анализа.
  exclude: # Не проверяем результаты сборки как исходный код.
    - build/** # Этот каталог создаётся автоматически при сборке.
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
